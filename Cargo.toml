[package]
name = "wolf-screen-recorder"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.8"
xcap = "0.1"
image = "0.25"
chrono = "0.4"
dirs = "5.0"
cpal = "0.15"
hound = "3.5"
tokio = { version = "1.0", features = ["full"] }
sysinfo = "0.30"
imageproc = "0.25"
ab_glyph = "0.2"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rfd = "0.14"
arboard = "3.4"
rdev = "0.5"

[build-dependencies]
slint-build = "1.8"